- name: create ec2 instances and route 53 records
  hosts: all
  connection: local
  vars:
    sg_id: "sg-000c5b9d2b80050b6"
    ami_id: "ami-0220d79f3f480ecf5"
    instances:
    - mongodb
    - catalogue
    env: dev
    domain_name: "daws88c.online"
  tasks:
  - name: start an instance with a public IP address
    amazon.aws.ec2_instance:
      name: "{{ item }}-{{ env }}"
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name:  "{{ item }}-{{ env }}"
        Project: "roboshop"
        Component: "{{ item }}"
        Environment: "{{ env }}"
    register: ec2_output
    loop: "{{ instances }}"
  - name: printing ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}" #mongodb-dev.daws88c.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"
  - name: create route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{ env }}.{{ domain_name }}" #roboshp[-dev.daws88c.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"
