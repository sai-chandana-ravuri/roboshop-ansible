- name: create ec2 instances and route 53 records
  hosts: all
  connection: local
  vars:
    sg_id: "sg-000c5b9d2b80050b6"
    ami_id: "ami-0220d79f3f480ecf5"
    instances:
    - mongodb
    - catalogue
    env: dev
  tasks:
  - name: start an instance with a public IP address
    amazon.aws.ec2_instance:
      name: "{{ item }}-{{ env }}"
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name:  "{{ item }}-{{ env }}"
        Project: "roboshop"
        Component: "{{ item }}"
        Environment: "{{ env }}"
    register: ec2_output
    loop: "{{ instances }}"
  - name: printing ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
