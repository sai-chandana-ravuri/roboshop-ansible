- name: cart configure
  hosts: cart
  become: yes
  tasks:
  - name: enable nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create system user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"
  - name: deleting default content
    ansible.builtin.file:
      path: /app
      state: absent
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: deleting default downaloeded zip content
    ansible.builtin.file:
      path: /tmp/cart.zip
      state: absent
  - name: Downloading the application
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip 
      dest: /tmp/cart.zip
    
  - name: unzipping cart
    ansible.builtin.unarchive:
      src:  /tmp/cart.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: Copying service file 
    ansible.builtin.copy:
      src: cart.service
      dest: /etc/systemd/system/cart.service
  - name: copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: install mongodb client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present
  - name: check products loaded or not
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("cart")'
    register: cart_output
  - name: printing cart_output
    ansible.builtin.debug:
      msg: "{{ cart_output }}"
  - name: load the products
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: cart_output.stdout | int < 0
  - name: start cart
    ansible.builtin.service:
      name: cart
      state: restarted
      enabled: yes
